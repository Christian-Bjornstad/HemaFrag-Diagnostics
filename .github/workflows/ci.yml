name: CI

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:

jobs:
  python:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.14"
          - os: macos-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest ruff==0.16.2
      - name: Check for undefined Python names
        run: python -m ruff check --select F821 core gui_qt qt_app.py config.py
      - name: Install Windows native engine
        if: runner.os == 'Windows'
        run: python -m pip install wheels/fraggler_kernels-0.1.2-cp310-abi3-win_amd64.whl
      - name: Verify Windows native engine
        if: runner.os == 'Windows'
        run: python -c "import fraggler_native; assert fraggler_native.is_available(); print(fraggler_native.version)"
      - name: Compile application modules
        run: python -m compileall -q qt_app.py gui_qt core
      - name: Run unit tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results.xml

  rust:
    name: Rust checks
    runs-on: macos-latest
    defaults:
      run:
        working-directory: fraggler-v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build standalone crates
        run: cargo build --release -p fraggler-core -p fraggler-cli -p fraggler-desktop
      - name: Check Python bindings
        run: cargo check -p fraggler-kernels-py
      - name: Test
        run: cargo test --workspace --exclude fraggler-kernels-py
